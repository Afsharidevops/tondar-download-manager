<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{font:13px system-ui,Ubuntu,sans-serif;margin:0;width:290px;color:#1d2b38}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(#2f86f0,#1458b8);color:#fff}
  header img{width:28px;height:28px}
  header b{font-size:14px}
  .st{padding:8px 12px;border-bottom:1px solid #e1e6eb}
  .ok{color:#2e7d32;font-weight:600}.bad{color:#c62828;font-weight:600}
  label{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer}
  .row{display:flex;align-items:center;gap:8px;padding:6px 12px}
  input[type=number]{width:80px}
  button{margin:6px 12px 10px;padding:5px 10px}
  .hint{padding:0 12px 10px;color:#5b6b7b;font-size:12px}
</style>
</head>
<body>
<header><img src="icons/48.png" alt=""><b>Tondar Download Manager</b></header>
<div class="st" id="st">Checking...</div>
<label><input type="checkbox" id="capture"> Capture browser downloads</label>
<label><input type="checkbox" id="panel"> Show "Download this video" panel</label>
<div class="row">App port <input type="number" id="port" min="1024" max="65535"></div>
<button id="perm" hidden>Allow access to all websites</button>
<div class="hint">Files with the extensions listed in Tondar Options are captured automatically. Right-click a link for "Download with Tondar".</div>
<script src="popup.js"></script>
</body>
</html>
