name: Build .deb and publish release

# Push a tag like v1.0.3 -> this builds tondar_1.0.3_all.deb and attaches it
# (plus a fixed-name copy tondar_all.deb for the one-line installer) to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 dpkg-dev

      - name: Check that the tag matches tondar/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c 'import tondar; print(tondar.VERSION)')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION in tondar/__init__.py"
            exit 1
          fi

      - name: Build package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 packaging/build_deb.py
          cp dist/tondar_*_all.deb dist/tondar_all.deb
          dpkg-deb -I dist/tondar_all.deb

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Tondar Download Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            install.sh

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tondar-deb
          path: dist/*.deb
