name: Build and release (Linux, Windows, macOS)

# Push a tag like v1.5.0 -> builds and tests:
#   Linux    tondar_<ver>_all.deb (+ tondar_all.deb for the one-line installer)
#   Windows  Tondar-Setup-<ver>.exe and a portable zip  (Windows 10+, x64)
#   macOS    Tondar-<ver>-macOS-apple-silicon.dmg / -intel.dmg  (macOS 12+)
# and publishes them as a GitHub Release. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match tondar/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python3 -c 'import tondar; print(tondar.VERSION)')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $VERSION in tondar/__init__.py"
            exit 1
          fi

  linux:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 dpkg-dev
      - name: Engine tests
        run: python3 tests/test_engine.py
      - name: Build .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 packaging/build_deb.py
          cp dist/tondar_*_all.deb dist/tondar_all.deb
          dpkg-deb -I dist/tondar_all.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.deb

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-desktop.txt
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Engine tests
        run: python tests/test_engine.py
      - name: Build installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build_desktop.py
      - name: Self-test (built app)
        shell: pwsh
        run: |
          $r = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process -FilePath "dist\Tondar\Tondar.exe" -ArgumentList "--self-test=$r" -Wait -PassThru
          Get-Content $r
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Self-test (installed with the setup program)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Tondar-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=""' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Tondar\Tondar.exe"
          if (-not (Test-Path $exe)) { Write-Error "not installed at $exe"; exit 1 }
          $r = "$env:RUNNER_TEMP\selftest-installed.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$r" -Wait -PassThru
          Get-Content $r
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Tondar-Setup-*.exe
            dist/Tondar-*-windows-portable.zip

  macos:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (arm64)
            name: macos-apple-silicon
          - runner: macos-15-intel    # Intel (x86_64)
            name: macos-intel
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r packaging/requirements-desktop.txt
      - name: Engine tests
        run: python3 tests/test_engine.py
      - name: Build app and disk image
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 packaging/build_desktop.py
      - name: Self-test (built app)
        run: |
          dist/Tondar.app/Contents/MacOS/Tondar --self-test="$RUNNER_TEMP/selftest.json"
          cat "$RUNNER_TEMP/selftest.json"
      - name: Self-test (app inside the .dmg)
        run: |
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -mountpoint /Volumes/TondarTest -nobrowse
          /Volumes/TondarTest/Tondar.app/Contents/MacOS/Tondar --self-test="$RUNNER_TEMP/selftest-dmg.json"
          cat "$RUNNER_TEMP/selftest-dmg.json"
          hdiutil detach /Volumes/TondarTest
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" dist/Tondar.app/Contents/Info.plist
          lipo -archs dist/Tondar.app/Contents/MacOS/Tondar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List files
        run: find artifacts -type f -exec ls -la {} \;
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Tondar Download Manager ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            install.sh
